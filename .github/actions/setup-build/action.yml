name: Set up FastZap build
description: Toolchains, Linux libraries and frontend dependencies for a Tauri build.

inputs:
  rust-targets:
    description: Extra Rust targets, comma separated.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libssl-dev \
          libdbus-1-dev \
          file
        # linuxdeploy (AppImage) runs as an AppImage itself.
        sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.rust-targets }}

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri

    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Install frontend dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Check versions
      shell: bash
      run: packaging/common/version.sh --check
