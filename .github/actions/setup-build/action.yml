name: Set up FastZap build
description: Toolchains, Linux libraries and frontend dependencies for a Tauri build.

inputs:
  rust-targets:
    description: Extra Rust targets, comma separated.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libssl-dev \
          libdbus-1-dev \
          file
        # linuxdeploy (AppImage) runs as an AppImage itself.
        sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        targets: ${{ inputs.rust-targets }}

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: src-tauri

    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Install frontend dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Check versions
      shell: bash
      run: packaging/common/version.sh --check
