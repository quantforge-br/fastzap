name: Build macOS disk image

on:
  workflow_dispatch:
    inputs:
      release_upload:
        description: "Upload the artifacts to a GitHub release"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag to upload to"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      release_upload:
        required: false
        type: boolean
        default: false
      release_tag:
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        if: ${{ inputs.release_upload && inputs.release_tag == '' }}
        shell: bash
        run: |
          echo "release_tag is required when release_upload=true"
          exit 1

      - uses: ./.github/actions/setup-build
        with:
          rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Mark official build
        run: packaging/common/build-info.sh "macOS"

      # Ad-hoc signed (signingIdentity "-"), not notarized.
      - name: Build
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastzap-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload to GitHub release
        if: ${{ inputs.release_upload }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
