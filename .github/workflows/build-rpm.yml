name: Build RPM package

on:
  workflow_dispatch:
    inputs:
      release_upload:
        description: "Upload the artifacts to a GitHub release"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag to upload to"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      release_upload:
        required: false
        type: boolean
        default: false
      release_tag:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    # The oldest supported runner keeps the glibc requirement low.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Release assets must come from the tagged source.
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Validate release tag
        if: ${{ inputs.release_upload && inputs.release_tag == '' }}
        shell: bash
        run: |
          echo "release_tag is required when release_upload=true"
          exit 1

      - uses: ./.github/actions/setup-build

      - name: Mark official build
        run: packaging/common/build-info.sh "RPM"

      - name: Build
        run: pnpm tauri build --bundles rpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastzap-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ inputs.release_upload }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: fastzap-rpm
          path: dist

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          # Artifacts keep their subdirectories (e.g. nsis/ and msi/).
          mapfile -t FILES < <(find dist -type f)
          packaging/common/release-upload.sh "${RELEASE_TAG}" "${FILES[@]}"
