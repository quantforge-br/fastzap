name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      rc:
        description: "Release candidate number, e.g. 1"
        required: true
        default: "1"

permissions:
  contents: write

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  create-prerelease:
    # Release candidates are cut from main only.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release candidate tag
        id: version
        env:
          RC: ${{ inputs.rc }}
        run: |
          case "${RC}" in
            '' | 0* | *[!0-9]*)
              echo "rc must be a positive integer, got '${RC}'"
              exit 1
              ;;
          esac
          VERSION="$(packaging/common/version.sh --check)"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "the base version must be X.Y.Z, got ${VERSION}"
            exit 1
          fi
          echo "release_tag=${VERSION}-rc.${RC}" >> "$GITHUB_OUTPUT"

      - name: Create or update pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          REMOTE_SHA="$(git ls-remote origin "refs/tags/${TAG}^{}" "refs/tags/${TAG}" | head -1 | cut -f1)"
          if [ -n "${REMOTE_SHA}" ] && [ "${REMOTE_SHA}" != "${GITHUB_SHA}" ]; then
            echo "tag ${TAG} already points at ${REMOTE_SHA}, not ${GITHUB_SHA}; bump rc"
            exit 1
          fi
          if [ -z "${REMOTE_SHA}" ]; then
            git tag "${TAG}"
            git push origin "${TAG}"
          fi
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --verify-tag --prerelease --latest=false \
              --title "FastZap ${TAG}" \
              --notes "Release candidate generated by GitHub Actions."
          fi

  deb:
    needs: create-prerelease
    uses: ./.github/workflows/build-deb.yml
    with:
      release_upload: true
      release_tag: ${{ needs.create-prerelease.outputs.release_tag }}

  rpm:
    needs: create-prerelease
    uses: ./.github/workflows/build-rpm.yml
    with:
      release_upload: true
      release_tag: ${{ needs.create-prerelease.outputs.release_tag }}

  appimage:
    needs: create-prerelease
    uses: ./.github/workflows/build-appimage.yml
    with:
      release_upload: true
      release_tag: ${{ needs.create-prerelease.outputs.release_tag }}

  flatpak:
    needs: create-prerelease
    uses: ./.github/workflows/build-flatpak.yml
    with:
      release_upload: true
      release_tag: ${{ needs.create-prerelease.outputs.release_tag }}

  snap:
    needs: create-prerelease
    uses: ./.github/workflows/build-snap.yml
    with:
      release_upload: true
      release_tag: ${{ needs.create-prerelease.outputs.release_tag }}

  windows:
    needs: create-prerelease
    uses: ./.github/workflows/build-windows.yml
    with:
      release_upload: true
      release_tag: ${{ needs.create-prerelease.outputs.release_tag }}

  macos:
    needs: create-prerelease
    uses: ./.github/workflows/build-macos.yml
    with:
      release_upload: true
      release_tag: ${{ needs.create-prerelease.outputs.release_tag }}
