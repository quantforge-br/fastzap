name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      rc:
        description: "Release candidate number, e.g. 1"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  create-prerelease:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release candidate tag
        id: version
        env:
          RC: ${{ inputs.rc }}
        run: |
          VERSION="$(packaging/common/version.sh --check)"
          echo "release_tag=${VERSION}-rc.${RC}" >> "$GITHUB_OUTPUT"

      - name: Create or update pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --latest=false \
              --title "FastZap $TAG" \
              --notes "Release candidate generated by GitHub Actions."
          else
            git tag "$TAG"
            git push origin "$TAG"
            gh release create "$TAG" --prerelease --latest=false \
              --title "FastZap $TAG" \
              --notes "Release candidate generated by GitHub Actions."
          fi

  deb:
    needs: create-prerelease
    uses: ./.github/workflows/build-deb.yml
    with:
      release_upload: true
      release_tag: ${{ needs.create-prerelease.outputs.release_tag }}
    secrets: inherit

  rpm:
    needs: create-prerelease
    uses: ./.github/workflows/build-rpm.yml
    with:
      release_upload: true
      release_tag: ${{ needs.create-prerelease.outputs.release_tag }}
    secrets: inherit

  appimage:
    needs: create-prerelease
    uses: ./.github/workflows/build-appimage.yml
    with:
      release_upload: true
      release_tag: ${{ needs.create-prerelease.outputs.release_tag }}
    secrets: inherit

  flatpak:
    needs: create-prerelease
    uses: ./.github/workflows/build-flatpak.yml
    with:
      release_upload: true
      release_tag: ${{ needs.create-prerelease.outputs.release_tag }}
    secrets: inherit

  snap:
    needs: create-prerelease
    uses: ./.github/workflows/build-snap.yml
    with:
      release_upload: true
      release_tag: ${{ needs.create-prerelease.outputs.release_tag }}
      publish_snap: false
    secrets: inherit

  windows:
    needs: create-prerelease
    uses: ./.github/workflows/build-windows.yml
    with:
      release_upload: true
      release_tag: ${{ needs.create-prerelease.outputs.release_tag }}
    secrets: inherit

  macos:
    needs: create-prerelease
    uses: ./.github/workflows/build-macos.yml
    with:
      release_upload: true
      release_tag: ${{ needs.create-prerelease.outputs.release_tag }}
    secrets: inherit
