name: Build snap

on:
  workflow_dispatch:
    inputs:
      release_upload:
        description: "Upload the artifacts to a GitHub release"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag to upload to"
        required: false
        type: string
        default: ""
      publish_snap:
        description: "Publish to the Snap Store (stable)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_upload:
        required: false
        type: boolean
        default: false
      release_tag:
        required: false
        type: string
        default: ""
      publish_snap:
        required: false
        type: boolean
        default: false
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Secrets cannot appear in `if`; without credentials the store step is
      # skipped instead of failing the release.
      SNAP_STORE_READY: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Release assets must come from the tagged source.
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Validate release tag
        if: ${{ inputs.release_upload && inputs.release_tag == '' }}
        shell: bash
        run: |
          echo "release_tag is required when release_upload=true"
          exit 1

      - name: Prepare snap recipe
        run: |
          packaging/common/build-info.sh "Snap"
          packaging/snap/prepare.sh

      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: snap

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastzap-snap
          path: ${{ steps.snap.outputs.snap }}
          if-no-files-found: error

      # A store release cannot be undone: only tagged releases publish.
      - name: Publish to the Snap Store
        if: ${{ inputs.publish_snap && startsWith(github.ref, 'refs/tags/') && env.SNAP_STORE_READY == 'true' }}
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.snap }}
          release: stable

  publish:
    needs: build
    if: ${{ inputs.release_upload }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: fastzap-snap
          path: dist

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          # Artifacts keep their subdirectories (e.g. nsis/ and msi/).
          mapfile -t FILES < <(find dist -type f)
          packaging/common/release-upload.sh "${RELEASE_TAG}" "${FILES[@]}"
