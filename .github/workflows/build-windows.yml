name: Build Windows installers

on:
  workflow_dispatch:
    inputs:
      release_upload:
        description: "Upload the artifacts to a GitHub release"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag to upload to"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      release_upload:
        required: false
        type: boolean
        default: false
      release_tag:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            bundles: nsis,msi
            artifacts: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          # WiX 3 has no arm64 MSI; NSIS only.
          - arch: arm64
            runner: windows-11-arm
            bundles: nsis
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4
        with:
          # Release assets must come from the tagged source.
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Validate release tag
        if: ${{ inputs.release_upload && inputs.release_tag == '' }}
        shell: bash
        run: |
          echo "release_tag is required when release_upload=true"
          exit 1

      - uses: ./.github/actions/setup-build

      - name: Mark official build
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: packaging/common/build-info.sh "Windows ${ARCH}"

      # Unsigned: there is no code-signing certificate yet.
      - name: Build
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: pnpm tauri build --bundles "${BUNDLES}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastzap-windows-${{ matrix.arch }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ inputs.release_upload }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: fastzap-windows-*
          merge-multiple: true
          path: dist

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          # Artifacts keep their subdirectories (e.g. nsis/ and msi/).
          mapfile -t FILES < <(find dist -type f)
          packaging/common/release-upload.sh "${RELEASE_TAG}" "${FILES[@]}"
