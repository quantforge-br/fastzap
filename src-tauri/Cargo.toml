[package]
name = "fastzap"
version = "0.1.0"
description = "Multi-account WhatsApp desktop client with Evolution Go accounts"
authors = ["quantmind-br"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.85"

[lib]
name = "fastzap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon", "image-png", "macos-proxy", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
url = "2"
percent-encoding = "2"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
resvg = "0.45"
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
html-escape = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }
webkit2gtk-sys = { version = "2.0", features = ["v2_40"] }
gtk = "0.18"
zbus = { version = "5", default-features = false, features = ["tokio"] }
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
notify-rust = { version = "4", default-features = false, features = ["dbus"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
